<div class="right_col" role="main" style="min-height: 99vh; padding-top: 10px;">
  <!-- Breadcrumbs & Header Row -->
  <div class="row mb-3">
    <div class="col-12 px-4">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0 m-0">
          <li class="breadcrumb-item text-muted small">Admin Console</li>
          <li class="breadcrumb-item active text-dark fw-bold small" aria-current="page">Delhivery Warehouses</li>
        </ol>
      </nav>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <h3 class="fw-bold text-dark m-0" style="font-size: 1.5rem;">Delhivery Warehouses</h3>
        <span class="badge bg-soft-info text-info px-4 py-2 rounded-pill fw-bold"
          style="background: rgba(17, 205, 239, 0.15); font-size: 13px;">{{ warehouses.length }} Locations</span>
      </div>
    </div>
  </div>

  <div class="x_panel border-0 shadow-sm rounded-4 mx-2">
    <div class="x_title border-0 pb-0 px-3 pt-4">
      <div class="row align-items-center">
        <div class="col">
          <button class="btn-create shadow-sm hover-lift" (click)="createWarehouse()">
            <i class="fa fa-plus"></i> ADD NEW WAREHOUSE
          </button>
        </div>
      </div>
      <div class="clearfix"></div>
    </div>
    <div class="x_content" style="display: block;">
      <div class="row">
        <div class="col-12">
          <div class="table-responsive">
            <ag-grid-angular #warehouseGrid style="width: 100%;" class="ag-theme-quartz ag-theme-acmecorp"
                [rowData]="warehouses" [columnDefs]="colDefs" [defaultColDef]="defaultColDef" [pagination]="true"
                [paginationPageSize]="20" [domLayout]="domLayout" [components]="frameworkComponents">
            </ag-grid-angular>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  
<!-- Add/Edit Modal -->
<div class="modal fade" id="warehouseModal" tabindex="-1" role="dialog" aria-labelledby="warehouseModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="warehouseModalLabel">
          {{ warehouse.dw_id == 0 ? 'Add Warehouse' : 'Edit Warehouse' }}
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form #whForm="ngForm" (ngSubmit)="saveWarehouse()">
          
          <div class="form-group mb-3">
            <label for="dw_name">Warehouse/Pickup Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="dw_name" name="dw_name" [(ngModel)]="warehouse.dw_name" required placeholder="e.g. Primary Warehouse">
          </div>

          <div class="form-group mb-3">
            <label for="dw_address">Complete Address <span class="text-danger">*</span></label>
            <textarea class="form-control" id="dw_address" name="dw_address" [(ngModel)]="warehouse.dw_address" required rows="2" placeholder="Street, landmark details..."></textarea>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="dw_city">City <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="dw_city" name="dw_city" [(ngModel)]="warehouse.dw_city" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="dw_state">State <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="dw_state" name="dw_state" [(ngModel)]="warehouse.dw_state" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="dw_pincode">Pincode <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="dw_pincode" name="dw_pincode" [(ngModel)]="warehouse.dw_pincode" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="dw_country">Country <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="dw_country" name="dw_country" [(ngModel)]="warehouse.dw_country" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="dw_phone">Contact Phone <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="dw_phone" name="dw_phone" [(ngModel)]="warehouse.dw_phone" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="dw_email">Contact Email</label>
                <input type="email" class="form-control" id="dw_email" name="dw_email" [(ngModel)]="warehouse.dw_email">
              </div>
            </div>
          </div>

          <div class="modal-footer px-0 pb-0 pt-3">
            <button type="button" class="btn btn-secondary rounded-pill px-4" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="!whForm.valid || saving">
              {{ saving ? 'Saving...' : 'Save Changes' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
