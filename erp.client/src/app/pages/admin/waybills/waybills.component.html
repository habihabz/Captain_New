<div class="right_col" role="main" style="min-height: 99vh; padding-top: 10px;">
  <!-- Breadcrumbs & Header Row -->
  <div class="row mb-3">
    <div class="col-12 px-4">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0 m-0">
          <li class="breadcrumb-item text-muted small">Admin Console</li>
          <li class="breadcrumb-item active text-dark fw-bold small" aria-current="page">Waybills</li>
        </ol>
      </nav>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <h3 class="fw-bold text-dark m-0" style="font-size: 1.5rem;">Waybills</h3>
        <span class="badge bg-soft-info text-info px-4 py-2 rounded-pill fw-bold"
          style="background: rgba(17, 205, 239, 0.15); font-size: 13px;">{{ waybills.length }} Waybills</span>
      </div>
    </div>
  </div>

  <div class="x_panel border-0 shadow-sm rounded-4 mx-2">
    <!-- Header Tools -->
    <div class="x_title border-0 pb-0 px-3 pt-4">
      <div class="row">
        <!-- Search -->
        <div class="col-md-3 col-sm-6">
          <div class="form-group">
            <label for="searchQuery" class="text-muted small fw-bold mb-1">SEARCH</label>
            <div class="input-group shadow-xs">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa fa-search"></i></span>
              <input type="text" id="searchQuery" class="form-control border-start-0 ps-0 text-dark font-13" placeholder="Search waybill or Order ID..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
            </div>
          </div>
        </div>

        <!-- Filter Status -->
        <div class="col-md-3 col-sm-6">
          <div class="form-group">
            <label for="statusFilter" class="text-muted small fw-bold mb-1">FILTER STATUS</label>
            <select id="statusFilter" class="form-control font-13" [(ngModel)]="statusFilter" (change)="applyFilters()" style="background-color: #fff;">
              <option value="All">All Statuses</option>
              <option value="Unused">Unused</option>
              <option value="Used">Used</option>
            </select>
          </div>
        </div>

        <!-- Date From -->
        <div class="col-md-2 col-sm-6">
          <div class="form-group">
            <label for="dateFrom" class="text-muted small fw-bold mb-1">FROM DATE</label>
            <input type="date" id="dateFrom" class="form-control font-13"
              [(ngModel)]="dateFrom" (change)="applyFilters()">
          </div>
        </div>

        <!-- Date To -->
        <div class="col-md-2 col-sm-6">
          <div class="form-group">
            <label for="dateTo" class="text-muted small fw-bold mb-1">TO DATE</label>
            <input type="date" id="dateTo" class="form-control font-13"
              [(ngModel)]="dateTo" (change)="applyFilters()">
          </div>
        </div>

        <!-- Space filler -->
        <div class="col-md"></div>

        <!-- Fetch Count -->
        <div class="col-md-2 col-sm-6 col-xs-6">
          <div class="form-group">
            <label for="fetchCount" class="text-muted small fw-bold mb-1">FETCH COUNT</label>
            <input type="number" id="fetchCount" class="form-control text-center font-13" [(ngModel)]="fetchCount" min="1" max="100">
          </div>
        </div>

        <!-- Action Button -->
        <div class="col-md-2 col-sm-6 col-xs-6">
          <div class="form-group">
            <label class="mb-1">&nbsp;</label>
            <button class="btn btn-warning form-control text-white fw-bold shadow-sm d-flex align-items-center justify-content-center" [disabled]="fetching" (click)="fetchNewWaybills()">
              <i class="fa fa-circle-o-notch fa-spin me-2 mr-2" *ngIf="fetching"></i>
              <i class="fa fa-download me-2 mr-2" *ngIf="!fetching"></i>
              FETCH WAYBILLS
            </button>
          </div>
        </div>

        <!-- Export CSV Button -->
        <div class="col-md-2 col-sm-6 col-xs-6">
          <div class="form-group">
            <label class="mb-1">&nbsp;</label>
            <button class="btn btn-outline-success form-control fw-bold shadow-sm d-flex align-items-center justify-content-center" (click)="exportCsv()">
              <i class="fa fa-file-text-o me-2 mr-2"></i>
              EXPORT CSV
            </button>
          </div>
        </div>
      </div>
      <hr class="my-4" />
    </div>

    <!-- Table content -->
    <div class="x_content" style="display: block;">
      <div class="row">
        <div class="col-12">
          <div class="table-responsive">
            <ag-grid-angular #waybillsGrid style="width: 100%;" class="ag-theme-quartz ag-theme-acmecorp"
                [rowData]="filteredWaybills" [columnDefs]="colDefs" [defaultColDef]="defaultColDef" [pagination]="true"
                [paginationPageSize]="20" [domLayout]="domLayout" [components]="frameworkComponents"
                [enableCellTextSelection]="true" [ensureDomOrder]="true"
                (gridReady)="onGridReady($event)">
            </ag-grid-angular>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
