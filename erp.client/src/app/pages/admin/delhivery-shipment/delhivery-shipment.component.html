<div class="right_col" role="main" style="min-height: 99vh; padding-top: 10px;">
  <!-- Breadcrumbs & Header Row -->
  <div class="row mb-3">
    <div class="col-12 px-4">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0 m-0">
          <li class="breadcrumb-item text-muted small">Admin Console</li>
          <li class="breadcrumb-item text-muted small">Delhivery</li>
          <li class="breadcrumb-item active text-dark fw-bold small" aria-current="page">Shipments</li>
        </ol>
      </nav>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <h3 class="fw-bold text-dark m-0" style="font-size: 1.5rem;">Delhivery Shipments</h3>
        <span class="badge bg-soft-info text-info px-4 py-2 rounded-pill fw-bold"
          style="background: rgba(17, 205, 239, 0.15); font-size: 13px;">{{ filteredOrders.length }} Orders</span>
      </div>
    </div>
  </div>

  <!-- Tabs System -->
  <div class="row mb-0 flex-shrink-0 px-2 mb-3">
    <div class="col-12 px-4">
      <ul class="nav nav-pills custom-tabs mb-0 border-0 d-flex gap-2">
        <li class="nav-item">
          <a class="nav-link rounded-pill px-4 fw-bold d-flex align-items-center gap-2" 
             [class.active]="currentTab === 'pending'" (click)="setTab('pending')" style="cursor: pointer;">
            <i class="fa fa-clock-o"></i> PENDING SHIPMENTS
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded-pill px-4 fw-bold d-flex align-items-center gap-2" 
             [class.active]="currentTab === 'shipped'" (click)="setTab('shipped')" style="cursor: pointer;">
            <i class="fa fa-check-circle"></i> CREATED SHIPMENTS
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="x_panel border-0 shadow-sm rounded-4 mx-2">
    <!-- Header Tools -->
    <div class="x_title border-0 pb-0 px-3 pt-4">
      <div class="row">
        <!-- Search -->
        <div class="col-md-4 col-sm-6">
          <div class="form-group">
            <label for="searchQuery" class="text-muted small fw-bold mb-1">SEARCH</label>
            <div class="input-group shadow-xs">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa fa-search"></i></span>
              <input type="text" id="searchQuery" class="form-control border-start-0 ps-0 text-dark font-13" 
                     placeholder="Search by Order ID, Customer, Phone..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
            </div>
          </div>
        </div>

        <!-- Space filler -->
        <div class="col-md"></div>

        <!-- Export CSV Button -->
        <div class="col-md-auto">
          <div class="form-group">
            <label class="mb-1">&nbsp;</label>
            <button class="btn btn-outline-success fw-bold shadow-sm d-flex align-items-center gap-2" (click)="exportCsv()">
              <i class="fa fa-file-text-o"></i> EXPORT CSV
            </button>
          </div>
        </div>
      </div>
      <div class="clearfix"></div>
    </div>

    <!-- Data Grid Content -->
    <div class="x_content px-3 pb-4" style="display: block;">
      <div class="row">
        <div class="col-12">
          <div class="table-responsive">
            <ag-grid-angular #shipmentsGrid style="width: 100%;" class="ag-theme-quartz ag-theme-acmecorp"
                [rowData]="filteredOrders" [columnDefs]="colDefs" [defaultColDef]="defaultColDef" [pagination]="true"
                [paginationPageSize]="20" [domLayout]="domLayout" [components]="frameworkComponents"
                [enableCellTextSelection]="true" [ensureDomOrder]="true"
                (gridReady)="onGridReady($event)">
            </ag-grid-angular>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Create Shipment Modal -->
<div class="modal fade" id="DelhiveryShipmentModal" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-md" role="document">
      <div class="modal-content border-0 rounded-4 overflow-hidden shadow">
          <div class="modal-header border-b bg-light py-3 px-4">
              <h5 class="modal-title fw-bold text-dark"><i class="fa fa-truck me-2 text-info"></i> Create Delhivery Shipment</h5>
              <button type="button" class="close border-0 bg-transparent text-secondary fs-4" (click)="closeModal($event, 'DelhiveryShipmentModal')" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
              </button>
          </div>
          <div class="modal-body p-4">
              <div class="form-group mb-3">
                  <label class="fw-bold text-muted small text-uppercase mb-2">Order ID</label>
                  <input type="text" class="form-control bg-light fw-bold" [value]="shipmentOrderId" readonly>
              </div>
              <div class="form-group mb-3">
                  <label class="fw-bold text-muted small text-uppercase mb-2">Registered Warehouse (Pickup Location) <span class="text-danger">*</span></label>
                  <select class="form-control" [(ngModel)]="selectedWarehouse" name="selectedWarehouse" required>
                      <option value="">-- Select Registered Warehouse --</option>
                      <option *ngFor="let wh of shipmentWarehouses" [value]="wh.dw_name">{{ wh.dw_name }} ({{ wh.dw_pincode }})</option>
                  </select>
                  <div *ngIf="shipmentWarehouses.length === 0" class="text-danger small mt-1">
                      <i class="fa fa-warning"></i> No registered warehouses. Please configure a warehouse first.
                  </div>
              </div>
              <div class="row">
                  <div class="col-md-6">
                      <div class="form-group mb-3">
                          <label class="fw-bold text-muted small text-uppercase mb-2">Payment Mode <span class="text-danger">*</span></label>
                          <select class="form-control" [(ngModel)]="shipmentPaymentMode" name="shipmentPaymentMode">
                              <option value="Prepaid">Prepaid</option>
                              <option value="COD">COD (Cash on Delivery)</option>
                              <option value="Pickup">Pickup (Reverse)</option>
                          </select>
                      </div>
                  </div>
                  <div class="col-md-6">
                      <div class="form-group mb-3">
                          <label class="fw-bold text-muted small text-uppercase mb-2">Weight (gms)</label>
                          <input type="number" class="form-control" [(ngModel)]="shipmentWeight" name="shipmentWeight" min="1">
                      </div>
                  </div>
              </div>
          </div>
          <div class="modal-footer bg-light border-0 py-3 px-4 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary px-3 py-2 fw-semibold" (click)="closeModal($event, 'DelhiveryShipmentModal')">Cancel</button>
              <button type="button" class="btn btn-info text-white px-4 py-2 fw-semibold d-flex align-items-center gap-2" 
                  [disabled]="shipmentSubmitting || !selectedWarehouse" (click)="submitDelhiveryShipment()">
                  <i class="fa" [ngClass]="{'fa-spinner fa-spin': shipmentSubmitting, 'fa-truck': !shipmentSubmitting}"></i>
                  {{ shipmentSubmitting ? 'Manifesting...' : 'Create Shipment' }}
              </button>
          </div>
      </div>
  </div>
</div>
