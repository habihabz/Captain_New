<div class="right_col p-4" role="main" style="background-color: #f8fafc; min-height: 100vh;">
    <!-- BREADCRUMBS -->
    <div class="row mb-3">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 px-0" style="background: transparent;">
                    <li class="breadcrumb-item"><a href="#/dashboard" class="text-decoration-none text-muted small">Home</a></li>
                    <li class="breadcrumb-item active text-dark fw-bold small" aria-current="page">Refund Management</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- MAIN HEADER CARD WITH TABS & CONTROLS -->
    <div class="card border-0 rounded-4 shadow-sm bg-white overflow-hidden mb-4">
        <!-- TABS HEADER -->
        <div class="card-header bg-white border-bottom px-4 pt-3 pb-0">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                <!-- TABS -->
                <div class="d-flex gap-2">
                    <button (click)="setTab('pending')"
                            class="nav-tab-btn px-4 py-3 fw-bold d-flex align-items-center gap-2 border-0 bg-transparent transition-all"
                            [class.active-tab-btn]="activeTab === 'pending'">
                        <i class="fa fa-clock-o fs-6"></i>
                        <span>Pending Payouts</span>
                        <span class="badge bg-danger rounded-pill px-2 py-1 ms-1" *ngIf="activeTab === 'pending' && rowCount > 0">{{ rowCount }}</span>
                    </button>
                    <button (click)="setTab('completed')"
                            class="nav-tab-btn px-4 py-3 fw-bold d-flex align-items-center gap-2 border-0 bg-transparent transition-all"
                            [class.active-tab-btn]="activeTab === 'completed'">
                        <i class="fa fa-history fs-6"></i>
                        <span>Payout History</span>
                    </button>
                </div>
                
                <!-- REFRESH BUTTON -->
                <div class="pb-2">
                    <button class="btn btn-outline-success btn-sm rounded-pill px-3 py-2 fw-bold d-flex align-items-center gap-2 shadow-xs border-2"
                            (click)="loadData()">
                        <i class="fa fa-refresh"></i> REFRESH
                    </button>
                </div>
            </div>
        </div>

        <!-- CONTROL BAR (Search & Filters) -->
        <div class="card-body p-4">
            <div class="row align-items-center justify-content-between g-3">
                <!-- LEFT TITLE & SUBTITLE -->
                <div class="col-md-4">
                    <h5 class="fw-bold text-dark mb-1 d-flex align-items-center gap-2" style="font-size: 16px; letter-spacing: -0.3px;">
                        <i class="fa" [ngClass]="activeTab === 'pending' ? 'fa-hourglass-half text-warning' : 'fa-check-circle text-success'"></i>
                        {{ activeTab === 'pending' ? 'Pending Settlements' : 'Completed Payout History' }}
                    </h5>
                    <div class="text-muted small">
                        {{ activeTab === 'pending' ? 'Review and process online customer refunds' : 'View record of completed Razorpay refund transactions' }}
                    </div>
                </div>

                <!-- RIGHT FILTERS -->
                <div class="col-md-8 col-lg-7">
                    <div class="d-flex align-items-center justify-content-md-end flex-wrap gap-3">
                        
                        <!-- Search Input -->
                        <div class="input-group shadow-xs rounded-pill overflow-hidden border bg-light" style="max-width: 280px;">
                            <span class="input-group-text bg-transparent border-0 ps-3 pe-2 text-muted">
                                <i class="fa fa-search small"></i>
                            </span>
                            <input type="number" class="form-control border-0 bg-transparent shadow-none small ps-1"
                                   [(ngModel)]="requestParms.id" placeholder="Search Order ID..."
                                   (keyup.enter)="applyFilters()">
                        </div>

                        <!-- Date Range Picker (History Tab Only) -->
                        <div *ngIf="activeTab === 'completed'" class="input-group shadow-xs rounded-pill overflow-hidden border bg-light" style="max-width: 260px;">
                            <span class="input-group-text bg-transparent border-0 ps-3 pe-2 text-muted">
                                <i class="fa fa-calendar small"></i>
                            </span>
                            <input type="text" appDateRange class="form-control border-0 bg-transparent shadow-none small ps-1"
                                   placeholder="Filter Date Range" 
                                   [startDate]="requestParms.startDate" 
                                   [endDate]="requestParms.endDate"
                                   (rangeChanged)="onDateRangeChanged($event)">
                        </div>

                        <!-- Filter & Reset Action Buttons -->
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm" (click)="applyFilters()">
                                FILTER
                            </button>
                            <button class="btn btn-sm btn-light border rounded-circle shadow-xs p-0 d-flex align-items-center justify-content-center" 
                                    style="width: 34px; height: 34px;" (click)="resetFilters()" title="Reset Filters">
                                <i class="fa fa-undo text-muted"></i>
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DATA GRID CARD -->
    <div class="card border-0 rounded-4 shadow-sm bg-white p-4">
        <div class="grid-card rounded-3 border overflow-hidden">
            <ag-grid-angular #refundGrid style="width: 100%; height: 530px;"
                             class="ag-theme-quartz" 
                             [rowData]="refundableOrders"
                             [columnDefs]="activeTab === 'pending' ? pendingColDefs : historyColDefs" 
                             [pagination]="true"
                             [paginationPageSize]="10" 
                             (gridReady)="onGridReady($event)">
            </ag-grid-angular>
        </div>
    </div>
</div>
