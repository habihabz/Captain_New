<!-- Global Loading Bar (Admin Console Only) -->
<div *ngIf="loadingService.loading$ | async" class="progress" style="position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 99999; background-color: transparent; border-radius: 0;">
    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 100%"></div>
</div>

<div class="container body">
    <div class="main_container">
        <app-topnav></app-topnav>
        <app-sidebar></app-sidebar>
        <router-outlet></router-outlet>
        
        <!-- Footer -->
        <footer class="mt-auto px-4 py-3 bg-white border-top d-flex align-items-center justify-content-between" 
                style="margin-left: 265px; transition: margin-left 0.3s ease;">
            <div class="small text-muted">
                &copy; {{ currentYear }} <strong>Captain ERP</strong>. All rights reserved.
            </div>
            <div class="small text-muted">
                Crafted with <i class="fa fa-heart text-danger"></i> by <a href="#" class="text-primary fw-bold text-decoration-none">EwaInfoTech</a>
            </div>
        </footer>
