<footer class="footer_area fix text-white" style="background-color: #0a0a0a; padding: 15px 0 10px;">
    <div class="container-fluid px-4 px-lg-5">
        <div class="d-flex flex-column flex-lg-row align-items-center justify-content-between mb-2">
            
            <!-- Get Help Links -->
            <ul class="list-inline mb-2 mb-lg-0 footer-links d-flex flex-wrap justify-content-center gap-3 gap-lg-4">
                <li class="list-inline-item m-0"><a routerLink="/shop">Delivery Info</a></li>
                <li class="list-inline-item m-0"><a routerLink="/shop">Terms & Conditions</a></li>
                <li class="list-inline-item m-0"><a routerLink="/shop">Privacy Notice</a></li>
                <li class="list-inline-item m-0"><a routerLink="/shop">FAQs</a></li>
                <li class="list-inline-item m-0"><a routerLink="/shop">Returns & Refunds</a></li>
            </ul>

            <!-- Social Media -->
            <div class="social__media d-flex gap-2 mt-2 mt-lg-0">
                <a href="#" class="social-icon" style="width: 32px; height: 32px; font-size: 14px;"><i class="fa fa-facebook-f"></i></a>
                <a href="#" class="social-icon" style="width: 32px; height: 32px; font-size: 14px;"><i class="fa fa-twitter"></i></a>
                <a href="#" class="social-icon" style="width: 32px; height: 32px; font-size: 14px;"><i class="fa fa-instagram"></i></a>
            </div>

        </div>

        <hr class="border-secondary my-2" style="opacity: 0.2;">

        <!-- Footer Bottom: Copyright & Contact Toggle -->
        <div class="row align-items-center">
            <div class="col-lg-6 mb-2 mb-lg-0 text-center text-lg-start">
                <p class="mb-0 text-muted" style="font-size: 13px;">
                    Copyright © 2024 <span class="fw-bold text-white">CAPTAIN</span>. All Rights Reserved.
                    | <a routerLink="/sitemap" class="text-muted text-decoration-none">Site Map</a>
                </p>
            </div>
            <div class="col-lg-6 text-center text-lg-end">
                <button class="btn btn-link text-decoration-none text-white p-0 fw-bold"
                    style="font-size: 13px; letter-spacing: 1px;" (click)="toggleContactInfo()">
                    CONTACT INFO <i class="fa ms-1 text-warning"
                        [ngClass]="showContact ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                </button>
            </div>
        </div>

        <!-- Collapsible Contact Info Content -->
        <div id="contactDetailsContent" class="row mt-2 collapse" [class.show]="showContact">
            <div class="col-12 text-center text-lg-end text-muted">
                <div class="p-3 rounded"
                    style="background-color: rgba(255,255,255,0.02); display: inline-block; text-align: left;">
                    <p class="mb-2" style="font-size: 14px;"><i class="fa fa-map-marker text-warning me-2"></i> Husi
                        International, Kallachal, Pulpatta, Malappuram, Kerala 676121</p>
                    <p class="mb-0" style="font-size: 14px;">
                        <i class="fa fa-envelope text-warning me-2"></i> info&#64;captain.net.in
                        <span class="mx-3 text-secondary d-none d-sm-inline">|</span>
                        <br class="d-sm-none">
                        <i class="fa fa-phone text-warning me-2 mt-2 mt-sm-0"></i> +91 7558030666
                    </p>
                </div>
            </div>
        </div>
    </div>
</footer>
